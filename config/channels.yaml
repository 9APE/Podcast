channels:
  - id: news_daily
    name: "The News Pod"
    niche: "the most viral and trending topics people are searching on YouTube right now"
    description: "The News Pod — the stories everyone's talking about, actually explained."
    host_male: "Alex"
    host_female: "Sarah"
    voice_male: "onyx"
    voice_female: "nova"
    episode_length_min: 7
    max_topics: 5
    audio_backend: notebooklm
    youtube_category_id: "25"
    use_trend_scout: true
    # Fallback queries used only if TrendScout fails
    search_queries:
      - "most viral trending topic news today"
      - "biggest controversy debate story today"
      - "most searched question trending today"
      - "viral moment sports entertainment news today"
      - "unexpected shocking story world news today"
    tags:
      - trending
      - viral
      - news
      - explained
      - daily briefing
      - current events

  - id: tech_daily
    name: "The Tech Pod"
    niche: "technology, AI, science, and the viral tech stories people can't stop talking about"
    description: "The Tech Pod — AI, tech, and science stories explained clearly every day."
    host_male: "Alex"
    host_female: "Sarah"
    voice_male: "onyx"
    voice_female: "nova"
    episode_length_min: 7
    max_topics: 5
    youtube_category_id: "28"
    use_trend_scout: false
    search_queries:
      - "artificial intelligence AI model research breakthrough today"
      - "major tech company product launch Apple Google Microsoft Meta Amazon today"
      - "science space biology physics breakthrough discovery today"
      - "cybersecurity privacy data hack news today"
      - "robotics autonomous vehicles future tech news today"
      - "startup funding acquisition tech business news today"
    tags:
      - technology
      - AI
      - artificial intelligence
      - tech news
      - science
